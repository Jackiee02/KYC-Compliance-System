[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-compliance-platform"
version = "0.3.0"
description = "Auditable KYC/AML screening, risk assessment, entity resolution, and case-management foundation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "datasketch>=1.6,<2",
  "Faker>=30,<31",
  "fastapi>=0.115,<1",
  "greenlet>=3.0,<3.2",
  "httpx>=0.27,<1",
  "jellyfish>=1.1,<2",
  "numpy>=1.26,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<2.3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "rapidfuzz>=3.10,<4",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
notebook = ["ipykernel>=6.29,<7"]

[project.scripts]
kyc = "kyc_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyc_platform = ["web/*.html", "web/static/*.css", "web/static/*.js", "web/static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kyc_platform --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["kyc_platform"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["kyc_platform"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
